[project]
name = "github-repo-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.16.0",
    "pygithub>=2.8.1",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
github-repo-analyzer = "github_repo_analyzer.server:main"

[tool.mcp]
mode = "development"
